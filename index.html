<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Location Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Business Location Finder</h1>
            <p class="subtitle">Find the perfect location for expanding your business</p>
        </header>

        <main>
            <div class="controls-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search for a city or address...">
                    <button id="searchBtn">Search</button>
                </div>

                <div class="criteria-panel">
                    <h2>Location Criteria</h2>
                    <div class="criteria-grid">
                        <div class="criteria-item">
                            <label for="businessType">Business Type:</label>
                            <select id="businessType">
                                <option value="retail">Retail</option>
                                <option value="restaurant">Restaurant</option>
                                <option value="office">Office</option>
                                <option value="warehouse">Warehouse</option>
                                <option value="service">Service</option>
                            </select>
                        </div>

                        <div class="criteria-item">
                            <label for="population">Min Population:</label>
                            <input type="number" id="population" value="10000" min="0">
                        </div>

                        <div class="criteria-item">
                            <label for="income">Min Avg Income ($):</label>
                            <input type="number" id="income" value="50000" min="0">
                        </div>

                        <div class="criteria-item">
                            <label for="competition">Competition Level:</label>
                            <select id="competition">
                                <option value="low">Low (preferred)</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>

                        <div class="criteria-item">
                            <label for="trafficVolume">Traffic Volume:</label>
                            <select id="trafficVolume">
                                <option value="high">High (preferred)</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>

                        <div class="criteria-item">
                            <label for="proximity">Proximity to Transport:</label>
                            <select id="proximity">
                                <option value="close">Close (< 1 mile)</option>
                                <option value="moderate">Moderate (1-3 miles)</option>
                                <option value="far">Far (> 3 miles)</option>
                            </select>
                        </div>
                    </div>

                    <button id="analyzeBtn" class="analyze-btn">Analyze Locations</button>
                </div>
            </div>

            <div class="results-section">
                <div class="map-container">
                    <h2>Location Map</h2>
                    <canvas id="map"></canvas>
                    <p class="map-help">Drag to pan, scroll to zoom, click markers for details</p>
                </div>

                <div class="locations-list">
                    <h2>Analyzed Locations</h2>
                    <div id="locationsList"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2024 Business Location Finder - Helping businesses expand strategically</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
